name: Build and dependency proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Provision pinned development native dependencies
        shell: pwsh
        run: ./scripts/Setup-Native.ps1
      - name: Locked restore, build and core tests
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Windows native load and decode proof (no sound device required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Smoke.ps1
      - name: Retain test and native decode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/test-results/*.trx
            artifacts/smoke/*.json
            artifacts/smoke/*.png
            artifacts/smoke/stage-d-mixer/*.f32
          if-no-files-found: warn
          retention-days: 14
