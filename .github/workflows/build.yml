name: Build and dependency proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Leave empty for a development build; 1.0.0 publishes the owner-authorized release'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MPSWIFT_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Read-only secret-pattern controls and current local Git scan
        shell: pwsh
        run: |
          python ./scripts/Test-SecretAudit.py
          if ($LASTEXITCODE -ne 0) { throw 'Secret-pattern negative/positive controls failed.' }
          New-Item artifacts/smoke -ItemType Directory -Force | Out-Null
          python ./scripts/Check-Secrets.py --output artifacts/smoke/secret-patterns.json
          if ($LASTEXITCODE -ne 0) { throw 'Secret-pattern findings require review.' }
      - name: Provision pinned development native dependencies
        shell: pwsh
        run: ./scripts/Setup-Native.ps1
      - name: Verify build and publication version agreement
        shell: pwsh
        run: ./scripts/Test-Versioning.ps1
      - name: Compile locked native security harness
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet restore tools/Player.AudioSmoke/Player.AudioSmoke.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked security-tool restore failed.' }
          dotnet build tools/Player.AudioSmoke/Player.AudioSmoke.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Security-tool build failed.' }
      - name: Locked restore, build and core tests
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Audit local portable development candidate
        shell: pwsh
        run: ./scripts/Package-Candidate.ps1 -SkipBuild
      - name: Package separate self-contained tag repair CLI
        shell: pwsh
        run: ./scripts/Package-TagRepair.ps1
      - name: Real packaged CLI preview, apply, backups and audio preservation
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/TagRepair-Smoke.ps1 -IsolatedRunner
      - name: Reject modified, missing and extra candidate files
        shell: pwsh
        run: |
          ./scripts/Test-LicenseTexts.ps1
          ./scripts/Test-CandidateIntegrity.ps1
      - name: Compile audited per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Installer.ps1
      - name: Standard-user install, reinstall, uninstall and installed WPF
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Installer-Smoke.ps1 -IsolatedRunner
      - name: Isolated bounded decoder mutation and file/DLL security checks
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Security-Smoke.ps1
      - name: Windows native load and decode proof (no sound device required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Smoke.ps1 -SkipBuild
      - name: Run extracted self-contained app from Unicode path
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Package-Smoke.ps1
      - name: Retain verified Windows ZIP for publication
        if: runner.os == 'Windows' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-windows-build
          path: |
            artifacts/portable/*.zip
            artifacts/portable/*.zip.sha256
            artifacts/portable/package-audit.json
            artifacts/portable/integrity-audit.json
            artifacts/portable/*.exe
            artifacts/portable/*.exe.sha256
            artifacts/portable/installer-audit.json
            artifacts/portable/installer-smoke.json
            artifacts/portable/tagrepair-audit.json
            artifacts/portable/tagrepair-smoke.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain test and native decode evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.os }}
          path: |
            artifacts/portable/*audit.json
            artifacts/portable/*.sha256
            artifacts/test-results/*.trx
            artifacts/smoke/*.json
            artifacts/smoke/g12-*-progress.jsonl
            artifacts/smoke/installer-*.log
            artifacts/smoke/*.png
            artifacts/smoke/stage-d-mixer/*.f32
          if-no-files-found: warn
          retention-days: 14
      - name: Retain separate CLI test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-tagrepair-${{ matrix.os }}
          path: |
            artifacts/tagrepair-test-results/*.trx
            artifacts/portable/tagrepair-*.json
            artifacts/smoke/tagrepair-cli.log
          if-no-files-found: warn
          retention-days: 14

  taglib-replacement:
    name: Windows rebuilt TagLib replacement proof
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      MPSWIFT_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
            scripts/fixtures/taglib-source-packages.lock.json
      - name: Provision pinned native dependencies and compile application
        shell: pwsh
        run: |
          ./scripts/Setup-Native.ps1
          dotnet restore Player.sln --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked application restore failed.' }
          dotnet build Player.sln -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Application build failed.' }
      - name: Verify rebuilt TagLib in actual Windows WPF
        shell: pwsh
        run: ./scripts/Test-TagLibReplacement.ps1
      - name: Retain source replacement evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-taglib-replacement
          path: |
            artifacts/smoke/taglib-replacement*.json
            artifacts/taglib-replacement-*/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish verified Windows ZIP and installer
    needs: [build, taglib-replacement]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: portable-windows-build
          path: artifacts/portable
      - name: Publish verified ZIP and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MPSWIFT_RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
        run: ./scripts/Publish-GitHubBuild.ps1 -RunId '${{ github.run_id }}' -Attempt '${{ github.run_attempt }}'
